# step1-build-to-dev — Azure DevOps pipeline (Cloudsmith OIDC)
#
# Prerequisites:
#   - Cloudsmith Azure DevOps extension installed in your ADO org
#   - Cloudsmith OIDC provider configured for this ADO org/project and mapped to the service account
#   - Docker Registry service connection named 'cloudsmith-docker' -> docker.cloudsmith.io
 
trigger:
  branches:
    include:
      - main
 
pool:
  vmImage: ubuntu-latest
 
variables:
  # ---- Cloudsmith settings ----
  CLOUDSMITH_WORKSPACE: 'cooke-industries'   # Cloudsmith workspace slug
  CLOUDSMITH_REPOSITORY: 'npm-app-dev'       # Cloudsmith repository slug
  CLOUDSMITH_SERVICE: 'gh-actions-gvq7'      # Cloudsmith service account slug (consider an ADO-specific one)
  imageName: 'node-app-dev'                  # Docker image name
 
steps:
- checkout: self
 
# Authenticate to Cloudsmith via OIDC and install the CLI
- task: CloudsmithCliSetupAndAuthenticate@1
  displayName: 'Cloudsmith: Authenticate via OIDC'
  inputs:
    authMethod: 'oidc'
    oidcAuthOnly: false
    pipInstall: false
    cliVersion: ''
    oidcNamespace: '$(CLOUDSMITH_WORKSPACE)'
    oidcServiceSlug: '$(CLOUDSMITH_SERVICE)'
 
- task: UseNode@1
  displayName: Setup Node.js 22
  inputs:
    version: '22.x'
 
- script: |
    printf 'registry=https://npm.cloudsmith.io/%s/%s/\n' "$(CLOUDSMITH_WORKSPACE)" "$(CLOUDSMITH_REPOSITORY)" > .npmrc
    printf '//npm.cloudsmith.io/%s/%s/:_authToken=%s\n' "$(CLOUDSMITH_WORKSPACE)" "$(CLOUDSMITH_REPOSITORY)" "$(CLOUDSMITH_API_KEY)" >> .npmrc
    rm -f package-lock.json
    npm install
  displayName: Install dependencies via Cloudsmith
 
- script: npm test
  displayName: Run tests
 
# Remove credentials from the workspace so they aren't picked up by the Docker build context
- script: rm -f .npmrc
  displayName: Clean up .npmrc
 
# Compute build date (Docker@2 arguments can't run shell substitutions)
- script: echo "##vso[task.setvariable variable=BUILD_DATE]$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  displayName: Set BUILD_DATE
 
# QEMU so the amd64 agent can build linux/arm64
- script: docker run --privileged --rm tonistiigi/binfmt --install arm64
  displayName: Set up QEMU (arm64)
 
- task: Docker@2
  displayName: Login to Cloudsmith
  inputs:
    command: login
    containerRegistry: cloudsmith-docker
 
- task: Docker@2
  displayName: Build Docker image
  inputs:
    command: build
    containerRegistry: cloudsmith-docker
    repository: $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY)/$(imageName)
    Dockerfile: '**/Dockerfile'
    arguments: |
      --platform linux/arm64
      --build-arg CLOUDSMITH_SERVICE=$(CLOUDSMITH_SERVICE)
      --build-arg CLOUDSMITH_WORKSPACE=$(CLOUDSMITH_WORKSPACE)
      --build-arg CLOUDSMITH_REPOSITORY=$(CLOUDSMITH_REPOSITORY)
      --build-arg CLOUDSMITH_API_KEY=$(CLOUDSMITH_API_KEY)
      --build-arg BUILD_NUMBER=$(Build.BuildId)
      --build-arg BUILD_DATE=$(BUILD_DATE)
      --build-arg GIT_SHA=$(Build.SourceVersion)
    tags: |
      $(Build.BuildId)
 
- task: Docker@2
  displayName: Push Docker image to Cloudsmith
  inputs:
    command: push
    containerRegistry: cloudsmith-docker
    repository: $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY)/$(imageName)
    tags: |
      $(Build.BuildId)
 
# Tag the image version we just pushed as 'release'
- script: |
    SLUG=$(cloudsmith ls pkg $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY) \
      -q "name:$(imageName) version:$(Build.BuildId)" -F json | jq -r '.data[0].slug')
    cloudsmith tag add $(CLOUDSMITH_WORKSPACE)/$(CLOUDSMITH_REPOSITORY)/$SLUG release
  displayName: Tag docker artifact as release