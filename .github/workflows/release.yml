name: Release validation
on:
  repository_dispatch:
    types: [cloudsmith-release]

permissions:
  id-token: write
  contents: read

env:
  CLOUDSMITH_SERVICE: gh-actions-gvq7
  CLOUDSMITH_WORKSPACE: cooke-industries
  CLOUDSMITH_REPOSITORY: test

jobs:
  validate-and-promote-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Auth to Cloudsmith with OIDC
      uses: cloudsmith-io/cloudsmith-cli-action@v2
      with:
        oidc-namespace: ${{ env.CLOUDSMITH_WORKSPACE }}
        oidc-service-slug: ${{ env.CLOUDSMITH_SERVICE }}
        oidc-auth-only: 'false'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install deps
      run: |
        printf 'registry=https://npm.cloudsmith.io/%s/%s/\n' "$CLOUDSMITH_WORKSPACE" "$CLOUDSMITH_REPOSITORY" > .npmrc
        printf '//npm.cloudsmith.io/%s/%s/:_authToken=%s\n' "$CLOUDSMITH_WORKSPACE" "$CLOUDSMITH_REPOSITORY" "$CLOUDSMITH_API_KEY" >> .npmrc
        rm -f package-lock.json
        npm install

    - name: Run validation tests
      run: npm test

    - name: On pass — add promote tag, remove release tag
      run: |
        SLUG=$(cloudsmith ls pkg $CLOUDSMITH_WORKSPACE/$CLOUDSMITH_REPOSITORY \
          -q "name:node-app-dev" -F json | jq -r '.data[0].slug')
        cloudsmith tag add $CLOUDSMITH_WORKSPACE/$CLOUDSMITH_REPOSITORY/$SLUG promote
        cloudsmith tag rm  $CLOUDSMITH_WORKSPACE/$CLOUDSMITH_REPOSITORY/$SLUG release
